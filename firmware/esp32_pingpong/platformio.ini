; 往復 (PING/PONG) で ESP32 の位相の乱れが打ち消せるかを確かめるファームウェア。DevKitC (classic) と C3 で共通。
; 書き込み: pio run -e esp32dev -t upload --upload-port COMx / pio run -e c3 -t upload --upload-port COM6
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600

[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
