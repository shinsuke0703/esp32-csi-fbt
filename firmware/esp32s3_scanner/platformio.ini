; ESP32-C3 (USB-Serial-JTAG, COM6) 向け。元: D:/Project Folder/OptiTrack/esp32_standalone_scanner
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM6
monitor_port = COM6
monitor_speed = 921600
build_flags =
    -D CONFIG_WIFI_CSI_ENABLED=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
