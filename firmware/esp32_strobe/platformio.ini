; ESP32-DevKitC (COM3) を CSI 用の「ストロボ」送信機にする: ESP-NOW ブロードキャストを一定間隔・OFDM 固定レートで送る
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200

; ESP32-C3 (COM6, USB-Serial-JTAG) をストロボにする場合
[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM6
monitor_port = COM6
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
